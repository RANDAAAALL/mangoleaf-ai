<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1224 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mangoleaf-arch-title mangoleaf-arch-desc">
      <title id="mangoleaf-arch-title">MangoLeaf AI Architecture</title>
      <desc id="mangoleaf-arch-desc">Offline-first Next.js PWA using on-device TensorFlow.js inference and Supabase synchronization.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: Browser/PWA -->
      <rect x="248" y="48" width="688" height="444" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="264" y="52" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="314" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER / PWA</text>

      <!-- Arrows -->
      <line x1="184" y1="272" x2="280" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMAGE</text>

      <line x1="424" y1="272" x2="520" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="448" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HASH</text>

      <line x1="664" y1="272" x2="760" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="692" y="252" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE</text>

      <!-- Sync Scans -->
      <line x1="904" y1="256" x2="1000" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="914" y="236" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="952" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC SCANS</text>

      <!-- Pull Guides -->
      <line x1="1000" y1="288" x2="904" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="910" y="294" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="952" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PULL GUIDES</text>

      <!-- Render -->
      <line x1="832" y1="240" x2="832" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="838" y="196" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="866" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER</text>

      <!-- Serwist Cache -->
      <line x1="592" y1="380" x2="592" y2="304" stroke="#4f5d75" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="598" y="336" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL CACHE</text>

      <!-- Offline loop -->
      <path d="M 856,304 V 328 Q 856,336 848,336 H 816 Q 808,336 808,328 V 304" fill="none" stroke="#4f5d75" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="802" y="342" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="832" y="351" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OFFLINE</text>

      <!-- Nodes -->
      <!-- Camera -->
      <rect x="40" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="240" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="68" y="255" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="112" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Camera / Gallery</text>
      <text x="112" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Image source</text>

      <!-- Preprocessing -->
      <rect x="280" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="240" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="246" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="316" y="255" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPELINE</text>
      <text x="352" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Preprocessing</text>
      <text x="352" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Resize &amp; Hash</text>

      <!-- TensorFlow.js -->
      <rect x="520" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="240" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="528" y="246" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="558" y="255" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INFERENCE</text>
      <text x="592" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TensorFlow.js</text>
      <text x="592" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Graph Model</text>

      <!-- IndexedDB -->
      <rect x="760" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="240" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="246" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="796" y="255" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL DB</text>
      <text x="832" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dexie DB</text>
      <text x="832" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Scan records</text>

      <!-- Supabase -->
      <rect x="1000" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="240" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1008" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="1028" y="255" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
      <text x="1072" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase</text>
      <text x="1072" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Storage &amp; DB sync</text>

      <!-- UI -->
      <rect x="760" y="100" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="100" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="768" y="106" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="780" y="115" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="832" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next.js App</text>
      <text x="832" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Screen render</text>

      <!-- Serwist -->
      <rect x="520" y="380" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="380" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="528" y="386" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="552" y="395" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
      <text x="592" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Serwist SW</text>
      <text x="592" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Offline cache</text>

      <!-- Legend -->
      <line x1="40" y1="520" x2="1184" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal Inference</text>

      <rect x="160" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Frontend logic</text>

      <rect x="280" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="300" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Local Store</text>

      <rect x="384" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="404" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cloud / Background</text>

      <line x1="528" y1="557" x2="556" y2="557" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="564" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>

      <line x1="640" y1="557" x2="668" y2="557" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="676" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Offline / Cache</text>
    </svg>