name: MangoLeaf CI

# Check pushes to master only, including merges; this workflow does not deploy.
on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub runs checks directly; local Git hooks belong on developers' computers.
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  security:
    name: Check secrets and private files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history catches secrets even after a later commit deletes them.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install verified secret scanner
        run: bun run security:install
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test security and export checks
        run: bun run test:tooling
      - name: Scan tracked files and Git history
        run: bun run security:check

  check:
    name: Check application
    runs-on: ubuntu-24.04
    # The core suite took 24.9 minutes on Linux; leave room for builds and browsers.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      # Match the repository's required check order; keep video/ as its own project.
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Build static application
        run: bun run build
      # This check-only build uses client fallbacks; production needs real public settings.
      - name: Verify exported PWA and model files
        run: bun run verify:export
      - name: Install browser dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Record browser test runtime
        run: |
          node -e "console.log(JSON.stringify({platform:process.platform,node:process.version,playwright:require('@playwright/test/package.json').version},null,2))"
          bun --version
      # Core cases include guided camera and installation, using the local mock backend.
      # R01/R03 stay explicit local runs; CI never starts the 30-minute session.
      - name: Test camera, installation, desktop, mobile, and offline workflows
        run: bun run test:e2e
      - name: Save browser reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-evidence
          path: |
            playwright-report/e2e/
            test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
